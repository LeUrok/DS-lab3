version: "3"
services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

# TODO добавить сервисы
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    restart: on-failure
    environment:
      PORT: "8080"
      CARS_URL: http://cars-service:8070
      RENTAL_URL: http://rental-service:8060
      PAYMENT_URL: http://payment-service:8050
    ports:
      - "8080:8080"
    depends_on:
      - cars-service
      - rental-service
      - payment-service

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: on-failure
    environment:
      PORT: "8050"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: program
      DB_PASSWORD: test
      DB_NAME: payments
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
  
  cars-service:
    build:
      context: ./cars-service
      dockerfile: Dockerfile
    container_name: cars-service
    restart: on-failure
    environment:
      PORT: "8070"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: program
      DB_PASSWORD: test
      DB_NAME: cars
    ports:
      - "8070:8070"
    depends_on:
      postgres:
        condition: service_healthy

  rental-service:
    build:
      context: ./rental-service
      dockerfile: Dockerfile
    container_name: rental-service
    restart: on-failure
    environment:
      PORT: "8060"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: program
      DB_PASSWORD: test
      DB_NAME: rentals
    ports:
      - "8060:8060"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db-data: